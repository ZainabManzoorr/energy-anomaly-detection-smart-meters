[tool.poetry]
name = "voltsense"
version = "0.1.0"
description = "Smart Energy Analytics & Anomaly Detection System"
authors = ["Zainab Manzoor <zainabmanzoorzoor@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

pandas = ">=2.0.0,<3.0.0"
numpy = ">=1.24.0,<3.0.0"
scikit-learn = ">=1.3.0,<2.0.0"
plotly = ">=5.0.0,<6.0.0"
streamlit = ">=1.28.0,<2.0.0"
matplotlib = ">=3.7.0,<4.0.0"
py7zr = ">=0.20.0,<1.0.0"
git-filter-repo = ">=2.0.0,<3.0.0"
torch = "^2.12.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
